[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metabaw"
version = "0.1.4"
description = "MetaBAW: metagenome Binning Automated Workflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "metaBAW contributors" }]
dependencies = ["setuptools<82"]

[project.scripts]
metabaw = "metabaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

